# Application name
spring.application.name=expense_tracker

# Live reload and automatic restart settings for development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Global log level
logging.level.root=INFO

# More detailed logs for your package
logging.level.james.expense_tracker=DEBUG

# Console log pattern (single-line, readable)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:expense_tracker}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
# when the app starts, check if the database matches the entity mappings,
# but do not update or change anything
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect